name: Content quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate full companion content
        run: node tests/content-checks.mjs
      - name: Validate Starter content and site structure
        run: node tests/starter-checks.mjs
